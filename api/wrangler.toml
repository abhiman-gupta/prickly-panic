ALLOWED_ORIGINS = "https://pricklypanic.abhimangupta.com,http://localhost:8137"
# public half of the VAPID key pair (the private half is the VAPID_PRIVATE_JWK secret)
VAPID_PUBLIC = "BNJpcOo_4tgKdIM0q1-cS9GWF1EwWODMWR21YT1D5qFfBOiktdgBfMvimgPD8msxlJSvnpCSADm9mPVIawGNScM"
VAPID_SUBJECT = "https://pricklypanic.abhimangupta.com"

# Secrets (set with `npx wrangler secret put NAME`, never committed):
#   PLAYER_SECRET     random string, signs player keys
#   ADMIN_TOKEN       random string, for removing bad scores
#   VAPID_PRIVATE_JWK private VAPID key as JSON (made by scripts/setup-keys.mjs)
